<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanSight</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #101713;
      color: #e8f0eb;
    }

    body[data-theme="light"] { background: #eef2ef; color: #17231b; }
    body[data-theme="dark"] { background: #08090d; color: #eeeef4; }
    body[data-theme="pastel"] { background: #f4eafa; color: #382845; }
    body[data-theme="cats"] { background: #271b25; color: #fff0f5; }

    main { width: min(900px, 100%); margin: auto; }

    header, .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 { margin: 0 0 6px; }
    .muted { opacity: .75; }

    .panel {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #8885;
      border-radius: 14px;
      background: #8881;
    }

    select, button {
      border: 1px solid #8888;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      color: inherit;
      background: #8882;
    }

    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    #stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 12px;
      background: #050706;
    }

    #video, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video { transform: scaleX(-1); }
    #overlay { pointer-events: none; }

    #placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: #d9e5dc;
    }

    #placeholder[hidden] { display: none; }
    #status, #modelStatus { min-height: 1.5em; }
    #modelStatus { margin-top: 12px; }
  </style>
</head>

<body data-theme="dark">
  <main>
    <header>
      <div>
        <h1>HumanSight</h1>
        <div class="muted">Private, in-browser person detection</div>
      </div>

      <label>
        Theme
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="cctv">CCTV green</option>
          <option value="light">Light</option>
          <option value="pastel">Pastel</option>
          <option value="cats">Plum</option>
        </select>
      </label>
    </header>

    <section class="panel">
      <div class="controls">
        <div>
          <button id="startButton" type="button">Start camera</button>
          <button id="stopButton" type="button" disabled>Stop camera</button>
          <button id="fullscreenButton" type="button">Full screen</button>
        </div>
      </div>

      <p id="status" role="status">Loading detection model…</p>

      <div id="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div id="placeholder">Camera preview will appear here.</div>
      </div>

      <p id="modelStatus" class="muted">Loading AI model…</p>
      <p class="muted">
        Camera access requires HTTPS and permission from your browser.
        Video is processed in your browser and is not uploaded by this page.
      </p>
    </section>
  </main>

  <!-- Load libraries before client.js. -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="client.js"></script>
</body>
</html>
